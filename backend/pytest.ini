[pytest]
# six-gate-build scaffold. The folder decides the marker: tests/unit -> unit, tests/integration -> integration.
#   pytest -m unit                                    fast TDD loop (gate 1)
#   pytest -m integration                             real wiring: DB, HTTP, files (gate 2)
#   pytest --cov=<package> --cov-report=term-missing  coverage (needs pytest-cov)
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --import-mode=importlib
markers =
    unit: fast, isolated tests (no network, no real database)
    integration: components wired together for real (database, HTTP, files, subprocesses)
    slow: long-running; keep out of the TDD loop with -m "not slow"
